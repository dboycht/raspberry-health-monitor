# Gradle / JVM 参数。
#
# 本机特例（与 keyforge 工程一致）：本机有一个本地代理（Steam++）对 github.com
# 等域名做 TLS 解密，JDK 自带信任库不认它，会导致依赖下载报
# "PKIX path building failed"。下面的 trustStore 是"JDK 自带信任库 + 该代理的根证书"，
# 只对本机有效；该文件缺失时 Gradle 会回退到默认信任库，因此在别的机器上无害。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=D:\\code\\DeepSeekHarness\\keyforge\\.certs\\local-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit

# Android / Kotlin 默认值
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 构建速度：复用守护进程与构建缓存。
# 注意：本机 Gradle wrapper 下载被 TLS 阻断，构建请用已解包的 gradle-8.13
# （见 tools/build.ps1），不要用 gradlew.bat。
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
