<text x="736" y="294" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">TFT 彩屏 ST7735S 128×160</text>
<text x="736" y="308" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">CS=CE1(脚26) 独占 · 3.3V   ·   环境页 / 报警页</text>
