<circle cx="724" cy="388" r="4" fill="#16a085"/>
<text x="736" y="392" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">DHT11 温湿度</text>
<text x="736" y="406" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">GPIO4 · 3.3V · 周期 3s   ·   环境温度 / 湿度</text>
<circle cx="724" cy="422" r="4" fill="#16a085"/>
<text x="736" y="426" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">HC-SR501 人体红外</text>
<text x="736" y="440" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">GPIO17 · 5V 供电 ⚠   ·   在床 / 活动检测</text>
<rect x="706" y="480" width="490" height="108" rx="6" fill="#f7f9fb" stroke="#c7d3dc" stroke-width="1"/>
<rect x="706" y="480" width="5" height="108" rx="2" fill="#7f8c8d" stroke="none" stroke-width="1"/>
<text x="720" y="498" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">输出器件（含限流元件）</text>
<circle cx="724" cy="520" r="4" fill="#7f8c8d"/>
<text x="736" y="524" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">蜂鸣器（有源）</text>
<text x="736" y="538" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">GPIO18 · 串 220Ω~1kΩ ⚠   ·   报警鸣叫</text>
<circle cx="724" cy="554" r="4" fill="#7f8c8d"/>
<text x="736" y="558" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">LED 绿 / 黄</text>
<text x="736" y="572" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">GPIO22 / GPIO23 · 各串 220Ω~1kΩ   ·   正常 / 注意</text>
<rect x="706" y="612" width="490" height="108" rx="6" fill="#f7f9fb" stroke="#c7d3dc" stroke-width="1"/>
<rect x="706" y="612" width="5" height="108" rx="2" fill="#7f8c8d" stroke="none" stroke-width="1"/>
<text x="720" y="630" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">输入按键</text>
<circle cx="724" cy="652" r="4" fill="#7f8c8d"/>
<text x="736" y="656" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">求救键</text>
<text x="736" y="670" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">GPIO27 · 内部上拉 · 长按 ≥1s   ·   触发紧急求助</text>
<circle cx="724" cy="686" r="4" fill="#7f8c8d"/>
<text x="736" y="690" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">测血氧键</text>
<text x="736" y="704" font-size="10" fill="#6b7780" text-anchor="start" font-weight="normal">GPIO13 · 内部上拉   ·   按需启动测量窗口</text>
<path d="M 600 261 L 686 261 L 686 150 L 701 150" fill="none" stroke="#8e44ad" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 600 321 L 686 321 L 686 282 L 701 282" fill="none" stroke="#2980b9" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 600 381 L 686 381 L 686 380 L 701 380" fill="none" stroke="#16a085" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 600 441 L 686 441 L 686 512 L 701 512" fill="none" stroke="#7f8c8d" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 600 381 L 686 381 L 686 644 L 701 644" fill="none" stroke="#7f8c8d" stroke-width="2.4" stroke-linecap="round"/>
<text x="34" y="794" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">⚠ 两条电源红线：红色轨 = 3.3V、橙色轨 = 5V，两条正轨绝不能短接；所有器件必须共地。</text>
<text x="34" y="812" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">⚠ MAX30102 / DHT11 / TFT 必须 3.3V；LCD1602 与 HC-SR501 必须 5V —— 接反的后果见 hardware/03。</text>
<text x="34" y="830" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">⚠ 每个 LED 与蜂鸣器的信号线上必须看到限流电阻（220Ω~1kΩ），否则可能烧 GPIO 引脚。</text>
<text x="34" y="848" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">⚠ SPI0 的 CS 固定用 CE1（脚 26），CE0（脚 24）空着不用；再加从设备请另占片选。</text>
<text x="34" y="866" font-size="11" fill="#6b7780" text-anchor="start" font-weight="normal">ℹ 已废止并删除的器件（不再接线）：蓝牙音箱（板上无可发声输出）、HC-SR04（ECHO 为 5V 电平）、TMP36+MCP3002。</text>
</svg>
